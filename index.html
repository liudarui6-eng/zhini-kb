      relHtml +
      (u.bodyHtml ? '<article class="md">' + u.bodyHtml + '</article>' : '') +
      '<div class="meta">' + (u.updated ? '更新于 ' + e(u.updated) + ' · ' : '') +
        '源文件 <code>' + e(u._file || '') + '</code></div>' +
      '</div>';

    toggleFoot(false);
    document.title = u.title + ' · 知你';
  }

  /* ── 调度 ─────────────────────────────────────────── */

  function render() {
    var r = view;
    if (r.name === 'unit') {
      var u = unitById[r.id];
      if (u) return renderUnit(u);
      document.getElementById('main').innerHTML = fail('这条知识不存在', '可能 id 拼错了，或者已经被删掉。');
      return;
    }
    if (r.name === 'book') {
      var b = bookById[r.id];
      if (b) return renderBook(b);
      document.getElementById('main').innerHTML = fail('这本书不存在', '回书架看看有哪些书。');
      return;
    }
    if (r.name === 'units') return renderUnits();
    if (r.name === 'map') return renderMap();
    return renderShelf();
  }

  function mount() {
    root.innerHTML =
      '<header class="bar"><div class="wrap bar-in">' +
        '<a class="brand" href="#/">' +
          '<span class="mark">知</span>' +
          '<span class="bt"><b>知你</b><i>书籍拆解</i></span>' +
        '</a>' +
        '<label class="search">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>' +
          '<input id="q" type="search" placeholder="搜索 书名 / 标题 / 结论 / 概念 / 标签" autocomplete="off" />' +
          '<kbd>/</kbd>' +
        '</label>' +
        '<span class="count">' + DATA.units.length + ' 条知识 · ' + DATA.books.length + ' 本书</span>' +
      '</div></header>' +
      '<main class="wrap" id="main"></main>' +
      '<footer class="wrap foot"><p>内容来自 <code>content/</code> 下的 Markdown 文件。改完跑 <code>node src/build.mjs</code> 重新生成。<br>' +
      '这是「知你」的第一个知识域：书籍拆解。结构（六要素 + 证据 + 状态）比内容更重要——内容可以慢慢换。</p></footer>';

    var qEl = document.getElementById('q');
    qEl.addEventListener('input', function () {
      state.q = qEl.value;
      if (view.name === 'unit' || view.name === 'map') go('#/all');
      else render();
    });

    document.getElementById('main').addEventListener('click', function (ev) {
      var chip = ev.target.closest('.chip');
      if (!chip) return;
      state[chip.dataset.k] = chip.dataset.v;
      render();
    });

    document.addEventListener('keydown', function (ev) {
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (ev.key === '/' && !/INPUT|TEXTAREA/.test(tag)) {
        ev.preventDefault();
        qEl.focus();
      } else if (ev.key === 'Escape') {
        if (document.activeElement === qEl) qEl.blur();
        else if (view.name !== 'shelf') go('#/');
      }
    });

    document.addEventListener('click', function (ev) {
      if (ev.target.closest && ev.target.closest('[data-back]')) {
        ev.preventDefault();
        back();
        return;
      }
      var add = ev.target.closest ? ev.target.closest('[data-add]') : null;
      if (add) {
        ev.preventDefault();
        if (!CAN_EDIT) return;
        if (add.dataset.add === 'book') window.KBEditor.openBook(null);
        else window.KBEditor.openUnit({ book: add.dataset.book || (DATA.books[0] || {}).id }, true);
        return;
      }
      var ex = ev.target.closest ? ev.target.closest('[data-export]') : null;
      if (ex) {
        ev.preventDefault();
        if (!window.KBMap) return;
        var label = ex.textContent;
        ex.disabled = true;
        ex.textContent = '导出中…';
        window.KBMap.exportBook(ex.dataset.title).catch(function () {}).then(function () {
          ex.disabled = false;
          ex.textContent = label;
        });
        return;
      }
      var ed = ev.target.closest ? ev.target.closest('[data-edit]') : null;
      if (ed) {
        ev.preventDefault();
        if (!CAN_EDIT) return;
        if (ed.dataset.edit === 'book') window.KBEditor.openBook(bookById[ed.dataset.id]);
        else window.KBEditor.openUnit(unitById[ed.dataset.id], false);
      }
    });

    // 所有站内链接都走 JS 跳转，不依赖浏览器处理 hash
    document.addEventListener('click', function (ev) {
      var a = ev.target && ev.target.closest ? ev.target.closest('a[href^="#/"]') : null;
      if (!a) return;
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button) return;
      ev.preventDefault();
      go(a.getAttribute('href'));
    });

    window.addEventListener('popstate', syncFromUrl);
    window.addEventListener('hashchange', syncFromUrl);

    // 只有 /__rev 能通（本地预览服务）才启用编辑，部署出去的静态站不会出现按钮
    fetch('/__rev', { cache: 'no-store' })
      .then(function (r) {
        if (r.ok && window.KBEditor) { CAN_EDIT = true; render(); }
      })
      .catch(function () {});

    view = parsePath(location.hash || '#/');
    render();
  }

  mount();
})();
</script>
</body>
</html>
